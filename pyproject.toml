[project]
name = "claude-session-manager"
version = "0.1.0"
description = "Terminal UI for browsing, searching and resuming Claude Code sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic[bedrock]>=1.11.0",
    "textual>=3",
]

[project.scripts]
csm = "csm.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# Long lines, short lambdas and names like `l` are this codebase's style; unused arguments are not.
select = ["E", "F", "W", "B", "ARG001", "ARG002"]
ignore = ["E501", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "ARG"]  # fixtures are imported, then named as test arguments
