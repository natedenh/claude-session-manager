name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Ubuntu, not macOS: on a private repo macOS minutes count 10x. csm's macOS-only
    # pieces (Ghostty, osascript, open) are stubbed in the tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Check csm's tmux config loads
        run: |
          tmux -V
          tmux -L probe -f src/csm/tmux.conf new-session -d -s probe 'sleep 5'
          tmux -L probe kill-server
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
