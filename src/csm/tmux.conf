# Config for csm's private tmux server (tmux -L csm). Your own ~/.tmux.conf is not read.

# No prefix key: Claude Code uses ctrl+b, and csm needs nothing but the binding below.
set -g prefix None
unbind-key C-b

# ctrl+\ toggles focus between the sidebar and the session beside it.
bind-key -n 'C-\' if-shell -F '#{@csm_sidebar}' 'select-pane -R' 'select-pane -L'

set -g mouse on
set -g status off
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard:hyperlinks"
# Pass modified keys like shift+enter through to claude.
set -g extended-keys on
set -g extended-keys-format csi-u
# Let claude's notifications and title updates reach Ghostty.
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g pane-border-lines heavy
set -g pane-active-border-style "fg=colour208"
