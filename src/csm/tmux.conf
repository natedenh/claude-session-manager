# Config for csm's private tmux server (tmux -L csm). Your own ~/.tmux.conf is not read.

# No prefix key: Claude Code uses ctrl+b, and csm needs nothing but the binding below.
set -g prefix None
unbind-key C-b

# ctrl+\ cycles focus: the sidebar, then the sessions beside it top to bottom, then back
# (panes are numbered in that order). With nothing beside the sidebar the key goes to csm,
# which toggles between its list and preview.
bind-key -n 'C-\' if-shell -F '#{&&:#{@csm_sidebar},#{pane_at_right}}' { send-keys 'C-\' } { select-pane -t :.+ }

set -g mouse on
set -g status off
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard:hyperlinks"
# Pass modified keys like shift+enter through to claude.
set -g extended-keys on
set -g extended-keys-format csi-u
# Let claude's notifications and title updates reach Ghostty.
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g pane-border-lines heavy
set -g pane-active-border-style "fg=colour208"

# tmux reports no mouse movement over borders, so there's no hover; instead the divider
# lights up while it's pressed or dragged, to show it's being resized.
bind-key -n MouseDown1Border set -w pane-border-style "fg=colour39" \; set -w pane-active-border-style "fg=colour39"
bind-key -n MouseDrag1Border resize-pane -M
bind-key -n MouseDragEnd1Border set -wu pane-border-style \; set -wu pane-active-border-style
bind-key -n MouseUp1Border set -wu pane-border-style \; set -wu pane-active-border-style
